<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Short 11B Complete 5-Step Master Deck</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-canvas: #090D16;
      --bg-panel: #111827;
      --bg-elevated: #1B2436;
      --bg-code: #0D1322;
      --bg-highlight: #243049;

      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-elevated: rgba(255, 255, 255, 0.14);

      --text-primary: #F8FAFC;
      --text-secondary: #CBD5E1;
      --text-muted: #94A3B8;

      --danger: #F43F5E;
      --danger-bg: rgba(244, 63, 94, 0.14);
      --danger-border: rgba(244, 63, 94, 0.50);

      --warning: #F59E0B;
      --warning-bg: rgba(245, 158, 11, 0.14);
      --warning-border: rgba(245, 158, 11, 0.50);

      --fast: #10B981;
      --fast-bg: rgba(16, 185, 129, 0.14);
      --fast-border: rgba(16, 185, 129, 0.50);

      --baseline: #38BDF8;
      --baseline-bg: rgba(56, 189, 248, 0.14);
      --baseline-border: rgba(56, 189, 248, 0.48);

      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-mono: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace;
      --ease-calm: cubic-bezier(0.22, 1, 0.36, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #030509;
      color: var(--text-primary);
      font-family: var(--font-sans);
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      user-select: none;
    }

    /* Studio Top Navigation & ZIP Exporter Bar */
    .studio-topbar {
      height: 54px;
      background: rgba(11, 16, 30, 0.96);
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      z-index: 200;
      backdrop-filter: blur(12px);
      flex-shrink: 0;
      transition: opacity 280ms ease;
    }

    body.clean-capture .studio-topbar,
    body.clean-capture .controls-dock {
      display: none !important;
      opacity: 0 !important;
      pointer-events: none !important;
    }
    body.clean-capture .short-frame {
      transform: scale(1) !important;
      border-radius: 0 !important;
      border: none !important;
    }

    .topbar-left, .topbar-center, .topbar-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-pill {
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.06em;
      color: #7DD3FC;
      background: var(--baseline-bg);
      border: 1px solid var(--baseline-border);
      padding: 5px 11px;
      border-radius: 7px;
    }

    .short-switcher {
      display: flex;
      background: #0D1322;
      border: 1px solid var(--border-subtle);
      border-radius: 9px;
      padding: 3px;
      gap: 4px;
    }

    .short-tab {
      font-family: var(--font-mono);
      font-size: 11.5px;
      font-weight: 700;
      color: var(--text-secondary);
      background: transparent;
      border: none;
      padding: 5px 12px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 160ms ease;
    }

    .short-tab.active {
      background: var(--baseline);
      color: #060911;
    }

    .step-tabs {
      display: flex;
      gap: 4px;
      background: #0D1322;
      padding: 3px;
      border-radius: 9px;
      border: 1px solid var(--border-subtle);
    }

    .step-tab {
      font-family: var(--font-mono);
      font-size: 11.5px;
      font-weight: 700;
      color: var(--text-secondary);
      background: transparent;
      border: none;
      padding: 5px 10px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 160ms ease;
    }

    .step-tab.active {
      background: rgba(56, 189, 248, 0.22);
      color: var(--text-primary);
    }

    .studio-btn {
      font-family: var(--font-mono);
      font-size: 11.5px;
      font-weight: 700;
      color: var(--text-primary);
      background: var(--bg-elevated);
      border: 1px solid var(--border-elevated);
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 180ms ease;
    }

    .studio-btn:hover {
      background: var(--bg-highlight);
      border-color: var(--baseline);
    }

    .studio-btn.zip-primary {
      background: var(--fast-bg);
      border-color: var(--fast-border);
      color: #6EE7B7;
    }

    /* Main Stage Viewport */
    .stage-viewport {
      flex: 1;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    /* ==========================================================================
       9:16 VERTICAL SLIDE FRAME (1080 x 1920)
       FIXED SPATIAL ANCHORS:
       - Top Header (96px)
       - Beat 1: Fixed Top Code + Register Anchor (380px)
       - Beat 2: Full-Bleed 3D Hardware Theater Canvas (940px)
       - Beat 3: Bottom True-to-Scale Telemetry Verdict Card (330px)
       ========================================================================== */
    .short-frame {
      width: 1080px;
      height: 1920px;
      background-color: var(--bg-canvas);
      background-image:
        radial-gradient(circle at 50% 15%, rgba(56, 189, 248, 0.09) 0%, transparent 55%),
        radial-gradient(circle at 50% 85%, rgba(16, 185, 129, 0.07) 0%, transparent 55%);
      position: relative;
      padding: 46px 42px 76px 42px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 22px;
      transform-origin: center center;
      box-shadow: 0 30px 90px rgba(0, 0, 0, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.10);
      border-radius: 22px;
      overflow: hidden;
    }

    .header-bar {
      display: flex;
      flex-direction: column;
      gap: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.10);
      padding-bottom: 14px;
      flex-shrink: 0;
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .step-badge {
      font-family: var(--font-mono);
      font-size: 21px;
      font-weight: 800;
      color: #7DD3FC;
      background: var(--baseline-bg);
      border: 1px solid var(--baseline-border);
      padding: 6px 16px;
      border-radius: 9px;
      letter-spacing: 0.05em;
    }

    .context-pill {
      font-family: var(--font-mono);
      font-size: 18.5px;
      font-weight: 800;
      color: #E2E8F0;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-subtle);
      padding: 6px 16px;
      border-radius: 9px;
      letter-spacing: 0.06em;
    }

    h1.slide-title {
      font-size: 46px;
      font-weight: 900;
      letter-spacing: -0.026em;
      line-height: 1.1;
      color: var(--text-primary);
    }

    /* Surface Panels & Phased Focus Drop-In */
    .surface-panel {
      background-color: var(--bg-panel);
      border: 1.5px solid var(--border-subtle);
      border-radius: 22px;
      padding: 22px 26px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .beat {
      opacity: 0.26;
      filter: saturate(0.32);
      transform: translateY(12px) scale(0.985);
      transition:
        opacity 680ms var(--ease-calm),
        filter 680ms var(--ease-calm),
        transform 680ms var(--ease-calm),
        border-color 680ms var(--ease-calm),
        box-shadow 680ms var(--ease-calm);
    }

    .beat.active {
      opacity: 1;
      filter: saturate(1);
      transform: translateY(0) scale(1);
    }

    .beat.active.glow-danger {
      border-color: var(--danger-border);
      box-shadow: 0 22px 55px -20px rgba(244, 63, 94, 0.35);
    }

    .beat.active.glow-fast {
      border-color: var(--fast-border);
      box-shadow: 0 22px 55px -20px rgba(16, 185, 129, 0.35);
    }

    .beat.active.glow-warn {
      border-color: var(--warning-border);
      box-shadow: 0 22px 55px -20px rgba(245, 158, 11, 0.32);
    }

    .beat.active.glow-base {
      border-color: var(--baseline-border);
      box-shadow: 0 22px 55px -20px rgba(56, 189, 248, 0.32);
    }

    .zone-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      flex-shrink: 0;
    }

    .zone-label {
      font-family: var(--font-mono);
      font-size: 19px;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #E2E8F0;
    }

    /* BEAT 1: Consistent Top-Anchored IDE Code Canvas + 2 Register Cards (370px) */
    .top-code-anchor {
      height: 368px;
      flex-shrink: 0;
    }

    .code-and-keys-grid {
      flex: 1;
      display: grid;
      grid-template-columns: 1.38fr 0.62fr;
      gap: 18px;
      min-height: 0;
    }

    .code-canvas {
      background-color: var(--bg-code);
      border: 1.5px solid rgba(255, 255, 255, 0.14);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06), 0 14px 32px rgba(0, 0, 0, 0.55);
    }

    .code-canvas-header {
      background-color: rgba(255, 255, 255, 0.045);
      border-bottom: 1px solid rgba(255, 255, 255, 0.09);
      padding: 9px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .code-dots {
      display: flex;
      gap: 7px;
    }
    .code-dot { width: 11px; height: 11px; border-radius: 50%; }
    .code-dot.red { background: #F43F5E; }
    .code-dot.amber { background: #F59E0B; }
    .code-dot.green { background: #10B981; }

    .code-file-label {
      font-family: var(--font-mono);
      font-size: 16.5px;
      font-weight: 700;
      color: #E2E8F0;
    }

    .code-canvas-body {
      flex: 1;
      padding: 16px 20px;
      font-family: var(--font-mono);
      font-size: 24px;
      font-weight: 600;
      line-height: 1.62;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 4px;
    }

    .code-dim {
      color: #CBD5E1;
      opacity: 0.90;
    }

    .key-stack {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .key-card {
      flex: 1;
      background: var(--bg-elevated);
      border: 1.5px solid var(--border-elevated);
      border-radius: 15px;
      padding: 14px 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .key-card-label {
      font-family: var(--font-mono);
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #E2E8F0;
    }

    .key-card-val {
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
      font-size: 32px;
      font-weight: 900;
      letter-spacing: -0.02em;
    }

    /* BEAT 2: Center Full-Bleed 3D Photorealistic Hardware Stage (920px) */
    .center-3d-stage {
      flex: 1;
      min-height: 0;
      padding: 20px 24px;
    }

    .canvas-3d-wrap {
      width: 100%;
      flex: 1;
      border-radius: 16px;
      overflow: hidden;
      background: radial-gradient(circle at 50% 45%, #16233A 0%, #070B13 100%);
      border: 1.5px solid rgba(255, 255, 255, 0.12);
      box-shadow: inset 0 0 60px rgba(0, 0, 0, 0.85);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .canvas-3d-wrap canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* BEAT 3: Bottom True-to-Scale Telemetry Verdict Panel (320px) */
    .bottom-verdict-panel {
      height: 320px;
      flex-shrink: 0;
    }

    .verdict-bars {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 14px;
    }

    .verdict-row {
      flex: 1;
      background: var(--bg-elevated);
      border-radius: 16px;
      padding: 14px 22px;
      border: 1.5px solid var(--border-elevated);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .verdict-row-top {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
    }

    .verdict-tag {
      font-family: var(--font-mono);
      font-size: 19px;
      font-weight: 800;
      letter-spacing: 0.04em;
      white-space: nowrap;
    }

    .verdict-num {
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
      font-size: 36px;
      font-weight: 900;
      letter-spacing: -0.02em;
      white-space: nowrap;
    }

    .bar-track {
      width: 100%;
      height: 24px;
      background: #090D16;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .bar-fill-danger {
      height: 100%;
      background: linear-gradient(90deg, rgba(244, 63, 94, 0.45), #F43F5E);
      border-radius: 7px;
    }

    .bar-fill-fast {
      height: 100%;
      background: linear-gradient(90deg, rgba(16, 185, 129, 0.45), #10B981);
      border-radius: 7px;
    }

    /* Semantic Pills */
    .pill-base {
      padding: 2px 11px;
      border-radius: 7px;
      background: var(--baseline-bg);
      border: 1px solid var(--baseline-border);
      color: #BAE6FD;
      font-weight: 800;
      font-family: var(--font-mono);
      display: inline-block;
    }

    .pill-danger {
      padding: 2px 11px;
      border-radius: 7px;
      background: var(--danger-bg);
      border: 1px solid var(--danger-border);
      color: #FECDD3;
      font-weight: 800;
      font-family: var(--font-mono);
      display: inline-block;
    }

    .pill-fast {
      padding: 2px 11px;
      border-radius: 7px;
      background: var(--fast-bg);
      border: 1px solid var(--fast-border);
      color: #A7F3D0;
      font-weight: 800;
      font-family: var(--font-mono);
      display: inline-block;
    }

    .pill-warn {
      padding: 2px 11px;
      border-radius: 7px;
      background: var(--warning-bg);
      border: 1px solid var(--warning-border);
      color: #FDE68A;
      font-weight: 800;
      font-family: var(--font-mono);
      display: inline-block;
    }

    /* Bottom Floating Playback Dock */
    .controls-dock {
      position: fixed;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(11, 16, 30, 0.94);
      border: 1px solid rgba(255, 255, 255, 0.16);
      padding: 8px 18px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 200;
      backdrop-filter: blur(12px);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.85);
    }

    .dock-btn {
      background: var(--bg-elevated);
      color: var(--text-primary);
      border: 1px solid var(--border-elevated);
      padding: 5px 13px;
      border-radius: 999px;
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .dock-btn.active-btn {
      background: var(--baseline);
      color: #060911;
      border-color: var(--baseline);
    }
  </style>
</head>
<body>
  <div class="stage-viewport" id="stage-viewport">
    <main class="short-frame" id="short-frame"></main>
  </div>
  <script>
    const Shorts3DHardwareEngine = {
      drawRoundedRect(ctx, x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + w, y, x + w, y + h, r);
        ctx.arcTo(x + w, y + h, x, y + h, r);
        ctx.arcTo(x, y + h, x, y, r);
        ctx.arcTo(x, y, x + w, y, r);
        ctx.closePath();
      },

      drawSiliconChamber(ctx, x, y, w, h, title, badge, borderColor, tintFill) {
        ctx.save();
        this.drawRoundedRect(ctx, x, y, w, h, 20);
        ctx.fillStyle = tintFill || "rgba(17, 24, 39, 0.80)";
        ctx.fill();
        ctx.lineWidth = 3;
        ctx.strokeStyle = borderColor || "rgba(255,255,255,0.16)";
        ctx.stroke();

        this.drawRoundedRect(ctx, x + 16, y + 16, w - 32, 46, 12);
        ctx.fillStyle = "rgba(9, 13, 22, 0.92)";
        ctx.fill();

        const innerW = w - 52;
        ctx.font = w < 420 ? "900 15px 'JetBrains Mono', monospace" : "900 17px 'JetBrains Mono', monospace";
        let badgeW = 0;
        if (badge) {
          badgeW = ctx.measureText(badge).width;
          ctx.fillStyle = borderColor || "#38BDF8";
          ctx.textAlign = "right";
          ctx.fillText(badge, x + w - 26, y + 45);
        }

        ctx.fillStyle = "#F8FAFC";
        ctx.textAlign = "left";
        const maxTitleW = Math.max(80, innerW - (badgeW > 0 ? badgeW + 16 : 0));
        ctx.fillText(title, x + 26, y + 45, maxTitleW);
        ctx.restore();
      },

      drawZen5Package(ctx, cx, cy, scale, label, highlightColor, pulsePhase) {
        ctx.save();
        ctx.translate(cx, cy);
        ctx.scale(scale, scale);

        ctx.shadowColor = "rgba(0, 0, 0, 0.85)";
        ctx.shadowBlur = 34;
        ctx.shadowOffsetY = 14;

        const subGrad = ctx.createLinearGradient(-135, -135, 135, 135);
        subGrad.addColorStop(0, "#0F5243");
        subGrad.addColorStop(0.5, "#0A3A2E");
        subGrad.addColorStop(1, "#06231B");
        this.drawRoundedRect(ctx, -135, -135, 270, 270, 16);
        ctx.fillStyle = subGrad;
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.shadowOffsetY = 0;
        ctx.lineWidth = 3;
        ctx.strokeStyle = "#2DD4BF";
        ctx.stroke();

        ctx.fillStyle = "#FBBF24";
        ctx.beginPath();
        ctx.moveTo(-124, -124);
        ctx.lineTo(-98, -124);
        ctx.lineTo(-124, -98);
        ctx.closePath();
        ctx.fill();

        for (let i = -96; i <= 96; i += 24) {
          ctx.fillStyle = "#D97706";
          ctx.fillRect(i - 7, -125, 14, 8);
          ctx.fillRect(i - 7, 117, 14, 8);
          ctx.fillRect(-125, i - 7, 8, 14);
          ctx.fillRect(117, i - 7, 8, 14);
        }

        const ihsGrad = ctx.createLinearGradient(-106, -106, 106, 106);
        ihsGrad.addColorStop(0, "#E2E8F0");
        ihsGrad.addColorStop(0.4, "#94A3B8");
        ihsGrad.addColorStop(0.7, "#475569");
        ihsGrad.addColorStop(1, "#64748B");
        this.drawRoundedRect(ctx, -108, -108, 216, 216, 20);
        ctx.fillStyle = ihsGrad;
        ctx.fill();
        ctx.lineWidth = 2.5;
        ctx.strokeStyle = "#F8FAFC";
        ctx.stroke();

        this.drawRoundedRect(ctx, -90, -90, 180, 180, 12);
        ctx.fillStyle = "#071714";
        ctx.fill();

        const drawChiplet = (x, y, w, h, title) => {
          const dieGrad = ctx.createLinearGradient(x, y, x + w, y + h);
          dieGrad.addColorStop(0, "#38BDF8");
          dieGrad.addColorStop(0.3, "#818CF8");
          dieGrad.addColorStop(0.6, "#EC4899");
          dieGrad.addColorStop(1, "#10B981");
          this.drawRoundedRect(ctx, x, y, w, h, 6);
          ctx.fillStyle = dieGrad;
          ctx.fill();
          ctx.strokeStyle = "#F8FAFC";
          ctx.lineWidth = 1.5;
          ctx.stroke();

          ctx.fillStyle = "rgba(9,13,22,0.92)";
          ctx.fillRect(x + 2, y + h / 2 - 12, w - 4, 24);
          ctx.fillStyle = "#F8FAFC";
          ctx.font = "900 13px 'JetBrains Mono', monospace";
          ctx.textAlign = "center";
          ctx.fillText(title, x + w / 2, y + h / 2 + 5);
        };

        drawChiplet(-80, -78, 74, 56, "ZEN5 CCD0");
        drawChiplet(6, -78, 74, 56, "ZEN5 CCD1");

        const iodGrad = ctx.createLinearGradient(-72, -10, 72, 76);
        iodGrad.addColorStop(0, "#1E293B");
        iodGrad.addColorStop(1, "#0F172A");
        this.drawRoundedRect(ctx, -74, -10, 148, 84, 8);
        ctx.fillStyle = iodGrad;
        ctx.fill();
        ctx.lineWidth = 2.5;
        ctx.strokeStyle = highlightColor || "#38BDF8";
        ctx.stroke();

        const glowAlpha = 0.25 + 0.16 * Math.sin(pulsePhase * 3);
        ctx.fillStyle = highlightColor || "#38BDF8";
        ctx.globalAlpha = glowAlpha;
        this.drawRoundedRect(ctx, -70, -6, 140, 76, 6);
        ctx.fill();
        ctx.globalAlpha = 1;

        ctx.fillStyle = "#F8FAFC";
        ctx.font = "900 16.5px 'JetBrains Mono', monospace";
        ctx.textAlign = "center";
        ctx.fillText(label || "ZEN 5 CORE", 0, 24);
        ctx.fillStyle = "#E2E8F0";
        ctx.font = "800 13.5px 'JetBrains Mono', monospace";
        ctx.fillText("RYZEN 9 9950X", 0, 49);

        ctx.restore();
      },

      drawDDR5Module(ctx, cx, cy, scale, title, subLabel, accentColor, isLit) {
        ctx.save();
        ctx.translate(cx, cy);
        ctx.scale(scale, scale);

        ctx.shadowColor = "rgba(0, 0, 0, 0.85)";
        ctx.shadowBlur = 30;
        ctx.shadowOffsetY = 12;

        const pcbGrad = ctx.createLinearGradient(-185, -62, 185, 62);

      drawFireAlarmStrobe(ctx, cx, cy, scale, label, subText, pulsePhase) {
        ctx.save();
        ctx.translate(cx, cy);
        ctx.scale(scale, scale);

        const rayAlpha = 0.30 + 0.22 * Math.sin(pulsePhase * 5);
        const coneGrad = ctx.createRadialGradient(0, -10, 12, 0, -10, 175);
        coneGrad.addColorStop(0, `rgba(244, 63, 94, ${rayAlpha + 0.35})`);
        coneGrad.addColorStop(0.5, `rgba(244, 63, 94, ${rayAlpha})`);
        coneGrad.addColorStop(1, "transparent");
        ctx.fillStyle = coneGrad;
        ctx.beginPath();
        ctx.arc(0, -10, 175, 0, Math.PI * 2);
        ctx.fill();

        const domeGrad = ctx.createLinearGradient(-56, -74, 56, 22);
        domeGrad.addColorStop(0, "#FDA4AF");
        domeGrad.addColorStop(0.3, "#F43F5E");
        domeGrad.addColorStop(0.75, "#9F1239");
        domeGrad.addColorStop(1, "#4C0519");
        ctx.beginPath();
        ctx.moveTo(-56, 26);
        ctx.lineTo(-46, -48);
        ctx.arc(0, -48, 46, Math.PI, 0, false);
        ctx.lineTo(56, 26);
        ctx.closePath();
        ctx.fillStyle = domeGrad;
        ctx.fill();
        ctx.lineWidth = 3;
        ctx.strokeStyle = "#FECDD3";
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(0, -26, 24, 0, Math.PI * 2);
        ctx.fillStyle = "#FFF1F2";
        ctx.fill();

        this.drawRoundedRect(ctx, -98, 24, 196, 58, 12);
        ctx.fillStyle = "#1E293B";
        ctx.fill();
        ctx.lineWidth = 2.5;
        ctx.strokeStyle = "#F43F5E";
        ctx.stroke();

        ctx.fillStyle = "#F8FAFC";
        ctx.font = "900 18.5px 'JetBrains Mono', monospace";
        ctx.textAlign = "center";
        ctx.fillText(label || "IDT[14] #PF", 0, 49);
        ctx.fillStyle = "#FDA4AF";
        ctx.font = "800 15.5px 'JetBrains Mono', monospace";
        ctx.fillText(subText || "RING 0 TRAP", 0, 71);

        ctx.restore();
      },

      drawOpticalLens(ctx, cx, cy, radius, topLabel, bottomLabel, color) {
        ctx.save();
        ctx.translate(cx, cy);

        const aura = ctx.createRadialGradient(0, 0, radius * 0.4, 0, 0, radius * 1.55);
        aura.addColorStop(0, color + "55");
        aura.addColorStop(1, "transparent");
        ctx.fillStyle = aura;
        ctx.beginPath(); ctx.arc(0, 0, radius * 1.55, 0, Math.PI * 2); ctx.fill();

        const ringGrad = ctx.createLinearGradient(-radius, -radius, radius, radius);
        ringGrad.addColorStop(0, "#F8FAFC");
        ringGrad.addColorStop(0.5, "#64748B");
        ringGrad.addColorStop(1, "#1E293B");
        ctx.beginPath();
        ctx.arc(0, 0, radius, 0, Math.PI * 2);
        ctx.fillStyle = ringGrad;
        ctx.fill();

        const glassGrad = ctx.createRadialGradient(-radius * 0.3, -radius * 0.3, 5, 0, 0, radius * 0.88);
        glassGrad.addColorStop(0, "rgba(255, 255, 255, 0.38)");
        glassGrad.addColorStop(0.4, "rgba(56, 189, 248, 0.22)");
        glassGrad.addColorStop(1, "rgba(9, 13, 22, 0.92)");
        ctx.beginPath();
        ctx.arc(0, 0, radius * 0.88, 0, Math.PI * 2);
        ctx.fillStyle = glassGrad;
        ctx.fill();
        ctx.lineWidth = 3;
        ctx.strokeStyle = color;
        ctx.stroke();

        ctx.fillStyle = "#F8FAFC";
        ctx.font = "900 20.5px 'JetBrains Mono', monospace";
        ctx.textAlign = "center";
        ctx.fillText(topLabel, 0, -4);
        ctx.fillStyle = color;
        ctx.font = "800 17px 'JetBrains Mono', monospace";
        ctx.fillText(bottomLabel, 0, 22);

        ctx.restore();
      },

      drawZeroPageIceBlock(ctx, cx, cy, w, h) {
        ctx.save();
        ctx.translate(cx - w / 2, cy - h / 2);

        const iceGrad = ctx.createLinearGradient(0, 0, w, h);
        iceGrad.addColorStop(0, "rgba(186, 230, 253, 0.55)");
        iceGrad.addColorStop(0.4, "rgba(56, 189, 248, 0.32)");
        iceGrad.addColorStop(1, "rgba(14, 116, 144, 0.52)");
        this.drawRoundedRect(ctx, 0, 0, w, h, 20);
        ctx.fillStyle = iceGrad;
        ctx.fill();
        ctx.lineWidth = 3;
        ctx.strokeStyle = "#BAE6FD";
        ctx.stroke();

        ctx.fillStyle = "#F8FAFC";
        ctx.font = "900 20px 'JetBrains Mono', monospace";

        ctx.fillText("❄️ KERNEL ZERO PAGE", w / 2, 46);

      drawRegisterPill(ctx, x, y, w, h, regName, regVal, borderColor) {
        ctx.save();
        this.drawRoundedRect(ctx, x, y, w, h, 14);
        ctx.fillStyle = "#0D1322";
        ctx.fill();
        ctx.lineWidth = 2.5;
        ctx.strokeStyle = borderColor || "#38BDF8";
        ctx.stroke();

        ctx.font = "900 17px 'JetBrains Mono', monospace";
        const nameW = ctx.measureText(regName).width;
        const boxW = Math.max(106, Math.min(w * 0.38, nameW + 24));

        this.drawRoundedRect(ctx, x + 10, y + 10, boxW, h - 20, 10);
        ctx.fillStyle = borderColor + "28";
        ctx.fill();

        ctx.fillStyle = borderColor || "#38BDF8";
        ctx.textAlign = "center";
        ctx.fillText(regName, x + 10 + boxW / 2, y + h / 2 + 6, boxW - 12);

        const valX = x + 10 + boxW + 14;
        const maxValW = Math.max(60, (x + w - 14) - valX);
        ctx.fillStyle = "#F8FAFC";
        ctx.font = "800 18.5px 'JetBrains Mono', monospace";
        ctx.textAlign = "left";
        ctx.fillText(regVal, valX, y + h / 2 + 6, maxValW);
        ctx.restore();
      },

      renderScene(canvas, sceneKey, pulsePhase) {
        if (!canvas) return;
        const ctx = canvas.getContext("2d");
        const W = canvas.width;
        const H = canvas.height;
        ctx.clearRect(0, 0, W, H);

        // Silicon Wafer Grid
        ctx.strokeStyle = "rgba(56, 189, 248, 0.055)";
        ctx.lineWidth = 1;
        for (let x = 0; x < W; x += 48) {
          ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
        }
        for (let y = 0; y < H; y += 48) {
          ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
        }

        const drawLaser = (x1, y1, x2, y2, color, width) => {
          ctx.save();
          ctx.strokeStyle = color;
          ctx.lineWidth = width || 6;
          ctx.shadowColor = color;
          ctx.shadowBlur = 18;
          ctx.setLineDash([16, 9]);
          ctx.lineDashOffset = -pulsePhase * 48;
          ctx.beginPath();
          ctx.moveTo(x1, y1);
          ctx.lineTo(x2, y2);
          ctx.stroke();
          ctx.restore();
        };

        switch (sceneKey) {
          case "11A_1": {
            // Zen 5 CPU Core Firing Store Lasers Into 512 #PF Strobe Traps
