<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hot Path C++ Ep 11 — Slide 03 / 29</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-canvas: #090D16;
      --bg-panel: #111827;
      --bg-elevated: #1B2436;
      --bg-code: #0D1322;
      --bg-highlight: #243049;

      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-elevated: rgba(255, 255, 255, 0.14);

      --text-primary: #F8FAFC;
      --text-secondary: #CBD5E1;
      --text-muted: #94A3B8;

      --token-danger: #F43F5E;
      --token-danger-bg: rgba(244, 63, 94, 0.14);
      --token-danger-border: rgba(244, 63, 94, 0.50);

      --token-warning: #F59E0B;
      --token-warning-bg: rgba(245, 158, 11, 0.14);
      --token-warning-border: rgba(245, 158, 11, 0.50);

      --token-fast: #10B981;
      --token-fast-bg: rgba(16, 185, 129, 0.14);
      --token-fast-border: rgba(16, 185, 129, 0.50);

      --token-baseline: #38BDF8;
      --token-baseline-bg: rgba(56, 189, 248, 0.14);
      --token-baseline-border: rgba(56, 189, 248, 0.48);

      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-mono: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace;
      --ease-calm: cubic-bezier(0.22, 1, 0.36, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 100vw;
      height: 100vh;
      background-color: #030509;
      color: var(--text-primary);
      font-family: var(--font-sans);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      user-select: none;
    }

    /* Studio Top Navigation & Package Exporter Bar */
    .studio-topbar {
      height: 52px;
      background: rgba(11, 16, 30, 0.96);
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      z-index: 200;
      backdrop-filter: blur(12px);
      flex-shrink: 0;
      transition: opacity 280ms ease, transform 280ms ease;
    }

    body.clean-capture .studio-topbar,
    body.clean-capture .studio-dock {
      display: none !important;
      opacity: 0 !important;
      pointer-events: none !important;
    }
    body.clean-capture .stage-wrapper {
      transform: scale(1) !important;
      border-radius: 0 !important;
      border: none !important;
    }

    .topbar-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-badge {
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 800;
      padding: 5px 11px;
      border-radius: 7px;
      background: var(--token-baseline-bg);
      color: #7DD3FC;
      border: 1px solid var(--token-baseline-border);
      letter-spacing: 0.05em;
    }

    .batch-tabs {
      display: flex;
      gap: 4px;
      background: #0D1322;
      padding: 3px;
      border-radius: 9px;
      border: 1px solid var(--border-subtle);
    }

    .batch-tab {
      font-family: var(--font-mono);
      font-size: 11.5px;
      font-weight: 700;
      color: var(--text-secondary);
      background: transparent;
      border: none;
      padding: 5px 10px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 160ms ease;
    }

    .batch-tab:hover {
      color: var(--text-primary);
    }

    .batch-tab.active {
      background: var(--token-baseline);
      color: #060911;
    }

    .export-btn {
      font-family: var(--font-mono);
      font-size: 11.5px;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 8px;
      border: 1px solid var(--border-elevated);
      background: var(--bg-elevated);
      color: var(--text-primary);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 180ms ease;
    }

    .export-btn:hover {
      background: var(--bg-highlight);
      border-color: var(--token-baseline);
    }

    .export-btn.zip-primary {
      background: var(--token-fast-bg);
      border-color: var(--token-fast-border);
      color: #6EE7B7;
    }

    .export-btn.zip-primary:hover {
      background: rgba(16, 185, 129, 0.24);
    }

    /* Main Stage Viewport */
    .viewport-area {
      flex: 1;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    /* Full-Bleed 1920x1080 Widescreen Stage */
    .stage-wrapper {
      width: 1920px;
      height: 1080px;
      background-color: var(--bg-canvas);
      background-image:
        radial-gradient(circle at 22% 18%, rgba(56, 189, 248, 0.08) 0%, transparent 52%),
        radial-gradient(circle at 82% 85%, rgba(16, 185, 129, 0.06) 0%, transparent 50%);
      border: 1px solid rgba(255, 255, 255, 0.10);
      border-radius: 18px;
      box-shadow: 0 30px 90px -20px rgba(0, 0, 0, 0.95);
      padding: 32px 42px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      transform-origin: center center;
      overflow: hidden;
    }

    .slide-section {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    /* Compact Header Bar (66px tall so 92% of screen is Visuals + Code) */
    .slide-header {
      width: 100%;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.10);
      padding-bottom: 12px;
      flex-shrink: 0;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .slide-marker {
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
      font-size: 19px;
      font-weight: 800;
      padding: 7px 15px;
      border-radius: 8px;
      background: var(--token-baseline-bg);
      color: #7DD3FC;
      border: 1px solid var(--token-baseline-border);
      letter-spacing: 0.04em;
    }

    .slide-title {
      font-size: 39px;
      font-weight: 900;
      letter-spacing: -0.025em;
      color: var(--text-primary);
    }

    .header-act {
      font-family: var(--font-mono);
      font-size: 16.5px;
      font-weight: 800;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      color: #E2E8F0;
      background: rgba(255, 255, 255, 0.04);
      padding: 8px 16px;
      border-radius: 9px;
      border: 1px solid var(--border-subtle);
    }

    /* Main 2-Column Fixed Spatial Grid:
       LEFT (660px Fixed) = Consistent Code Anchor + 2 Hardware Register Cards
       RIGHT (1152px Full-Bleed) = 3D Visual Hardware Stage + True-to-Scale Metric Bar */
    .main-stage-grid {
      flex: 1;
      display: grid;
      grid-template-columns: 640px minmax(0, 1fr);
      gap: 24px;
      min-height: 0;
    }

    .left-code-column {
      display: flex;
      flex-direction: column;
      gap: 20px;
      height: 100%;
      min-height: 0;
    }

    .right-visual-column {
      display: flex;
      flex-direction: column;
      gap: 20px;
      height: 100%;
      min-height: 0;
    }

    /* Surfaces */
    .surface-panel {
      background-color: var(--bg-panel);
      border: 1.5px solid var(--border-subtle);
      border-radius: 18px;
      padding: 22px 26px;
      transition:
        opacity 750ms var(--ease-calm),
        transform 750ms var(--ease-calm),
        border-color 750ms var(--ease-calm),
        box-shadow 750ms var(--ease-calm),
        filter 750ms var(--ease-calm);
    }

    /* Fixed-Position Visual Code Canvas (Always Top-Left on Every Slide!) */
    .code-anchor-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px 24px;
    }

    .zone-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      flex-shrink: 0;
    }

    .zone-label {
      font-family: var(--font-mono);
      font-size: 17.5px;
      font-weight: 800;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: #E2E8F0;
    }

    .code-canvas {
      flex: 1;
      background-color: var(--bg-code);
      border: 1.5px solid rgba(255, 255, 255, 0.14);
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06), 0 16px 36px rgba(0, 0, 0, 0.55);
    }

    .code-canvas-header {
      background-color: rgba(255, 255, 255, 0.045);
      border-bottom: 1px solid rgba(255, 255, 255, 0.09);
      padding: 10px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .code-dots {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .code-dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
    }
    .code-dot.red { background-color: #F43F5E; }
    .code-dot.amber { background-color: #F59E0B; }
    .code-dot.green { background-color: #10B981; }

    .code-file-label {
      font-family: var(--font-mono);
      font-size: 16px;
      font-weight: 700;
      color: #E2E8F0;
      letter-spacing: 0.04em;
    }

    .code-canvas-body {
      flex: 1;
      padding: 20px 24px;
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
      font-size: 23px;
      font-weight: 600;
      line-height: 1.66;
      color: #F8FAFC;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 4px;
    }

    .code-line {
      padding: 3px 8px;
      border-radius: 6px;
      white-space: nowrap;
    }

    .code-line.active-line {
      background: rgba(56, 189, 248, 0.11);
      border-left: 4px solid var(--token-baseline);
      padding-left: 12px;
    }

    .code-line.danger-line {
      background: rgba(244, 63, 94, 0.13);
      border-left: 4px solid var(--token-danger);
      padding-left: 12px;
    }

    .code-line.fast-line {
      background: rgba(16, 185, 129, 0.13);
      border-left: 4px solid var(--token-fast);
      padding-left: 12px;
    }

    /* Spotlight Masking: Dim Boilerplate Tokens so Only Hardware Nouns Pop */
    .code-dim {
      color: #CBD5E1;
      opacity: 0.90;
    }

    /* Left-Bottom Hardware State Key Cards (Zero Prose, Big Tokens) */
    .hw-key-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      height: 168px;
      flex-shrink: 0;
    }

    .hw-key-card {
      background: var(--bg-elevated);
      border: 1.5px solid var(--border-elevated);
      border-radius: 16px;
      padding: 18px 22px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .hw-key-label {
      font-family: var(--font-mono);
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: #E2E8F0;
    }

    .hw-key-val {
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
      font-size: 33px;
      font-weight: 900;
      letter-spacing: -0.02em;
      color: var(--text-primary);
    }

    /* Right-Top Full-Bleed 3D Hardware Theater */
    .visual-stage-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 18px 22px;
      min-height: 0;
    }

    .realistic-canvas-wrap {
      position: relative;
      width: 100%;
      flex: 1;
      border-radius: 14px;
      overflow: hidden;
      background: radial-gradient(circle at 50% 45%, #16233A 0%, #070B13 100%);
      border: 1.5px solid rgba(255, 255, 255, 0.12);
      box-shadow: inset 0 0 60px rgba(0, 0, 0, 0.85);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .realistic-canvas-wrap canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Right-Bottom Single True-to-Scale Visual Telemetry Bar (168px tall) */
    .telemetry-bar-panel {
      height: 168px;
      flex-shrink: 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      min-width: 0;
      gap: 22px;
      padding: 18px 24px;
      align-items: center;
    }

    .metric-compare-box {
      height: 100%;
      min-width: 0;
      min-width: 0;
      background: var(--bg-elevated);
      border-radius: 14px;
      padding: 14px 22px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border: 1.5px solid var(--border-elevated);
    }

    .metric-compare-top {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 3px;
    }

    .metric-tag {
      font-family: var(--font-mono);
      font-size: 14.5px;
      font-weight: 800;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .metric-hero-num {
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
      font-size: 27px;
      font-weight: 900;
      letter-spacing: -0.02em;
      white-space: nowrap;
    }

    .bar-track {
      width: 100%;
      height: 16px;
      background: #090D16;
      border-radius: 7px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
    }

    .bar-fill-danger {
      height: 100%;
      background: linear-gradient(90deg, rgba(244, 63, 94, 0.45), #F43F5E);
      border-radius: 6px;
    }

    .bar-fill-fast {
      height: 100%;
      background: linear-gradient(90deg, rgba(16, 185, 129, 0.45), #10B981);
      border-radius: 6px;
    }

    /* Eye-Friendly Phased Focus Drop-In States */
    .reveal-step {
      opacity: 0.26;
      filter: saturate(0.32);
      transform: translateY(12px) scale(0.985);
      transition:
        opacity 750ms var(--ease-calm),
        transform 750ms var(--ease-calm),
        border-color 750ms var(--ease-calm),
        box-shadow 750ms var(--ease-calm),
        filter 750ms var(--ease-calm);
    }

    .reveal-step.step-active {
      opacity: 1;
      filter: saturate(1);
      transform: translateY(0) scale(1);
    }

    .reveal-step.step-active.glow-danger {
      border-color: var(--token-danger-border);
      box-shadow: 0 20px 50px -22px rgba(244, 63, 94, 0.32);
    }

    .reveal-step.step-active.glow-fast {
      border-color: var(--token-fast-border);
      box-shadow: 0 20px 50px -22px rgba(16, 185, 129, 0.32);
    }

    .reveal-step.step-active.glow-warn {
      border-color: var(--token-warning-border);
      box-shadow: 0 20px 50px -22px rgba(245, 158, 11, 0.30);
    }

    .reveal-step.step-active.glow-base {
      border-color: var(--token-baseline-border);
      box-shadow: 0 20px 50px -22px rgba(56, 189, 248, 0.30);
    }

    /* Semantic Pills */
    .pill-base {
      padding: 2px 10px;
      border-radius: 6px;
      background: var(--token-baseline-bg);
      border: 1px solid var(--token-baseline-border);
      color: #BAE6FD;
      font-weight: 800;
      font-family: var(--font-mono);
      display: inline-block;
    }

    .pill-danger {
      padding: 2px 10px;
      border-radius: 6px;
      background: var(--token-danger-bg);
      border: 1px solid var(--token-danger-border);
      color: #FECDD3;
      font-weight: 800;
      font-family: var(--font-mono);
      display: inline-block;
    }

    .pill-fast {
      padding: 2px 10px;
      border-radius: 6px;
      background: var(--token-fast-bg);
      border: 1px solid var(--token-fast-border);
      color: #A7F3D0;
      font-weight: 800;
      font-family: var(--font-mono);
      display: inline-block;
    }

    .pill-warn {
      padding: 2px 10px;
      border-radius: 6px;
      background: var(--token-warning-bg);
      border: 1px solid var(--token-warning-border);
      color: #FDE68A;
      font-weight: 800;
      font-family: var(--font-mono);
      display: inline-block;
    }

    .mono-num {
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
    }

    /* Bottom Floating Studio Control Dock */
    .studio-dock {
      position: fixed;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 200;
      background: rgba(11, 16, 30, 0.94);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 999px;
      padding: 7px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.85);
      transition: opacity 380ms var(--ease-calm), transform 380ms var(--ease-calm);
    }

    .dock-group {
      display: flex;
      align-items: center;
      gap: 4px;
      background: #111827;
      padding: 3px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .dock-btn {
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 700;
      padding: 5px 11px;
      border-radius: 999px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 180ms ease;
    }

    .dock-btn:hover {
      color: var(--text-primary);
    }

    .dock-btn.active {
      background: var(--token-baseline-bg);
      color: #7DD3FC;
      border-color: var(--token-baseline-border);
    }

    .step-dot {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 800;
      border: none;
      background: #1B2436;
      color: var(--text-secondary);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 180ms ease;
    }

    .step-dot.active {
      background: #38BDF8;
      color: #090D16;
    }

    .divider {
      width: 1px;
      height: 18px;
      background: rgba(255, 255, 255, 0.12);
    }
  </style>
</head>
<body>
  <div class="viewport-area" id="viewport-area">
    <main id="presentation-stage" class="stage-wrapper"></main>
  </div>

  <aside id="studio-dock" class="studio-dock">
    <div class="dock-group" id="dock-slide-buttons"></div>
    <div class="divider"></div>
    <div style="display:flex;align-items:center;gap:6px;">
      <button id="step-dot-1" class="step-dot active" onclick="setStep(1)">1</button>
      <button id="step-dot-2" class="step-dot" onclick="setStep(2)">2</button>
      <button id="step-dot-3" class="step-dot" onclick="setStep(3)">3</button>
    </div>
    <div class="divider"></div>
    <button class="dock-btn active" onclick="toggleAutoPlay()" id="autoplay-label">⏸ Auto-Sync</button>
    <button class="dock-btn" onclick="restartSlide()">↺ Replay</button>
  </aside>

  <script>
    // =========================================================================
    // FULL-BLEED (1100 x 640) 3D HARDWARE & SILICON ARCHITECTURE ENGINE
    // Uses 100% of the visual stage with rich 3D hardware renders, animated
    // memory buses, silicon chambers, register files, and zero prose walls.
    // =========================================================================
    const HardwareArtEngine = {
      drawRoundedRect(ctx, x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + w, y, x + w, y + h, r);
        ctx.arcTo(x + w, y + h, x, y + h, r);
        ctx.arcTo(x, y + h, x, y, r);
        ctx.arcTo(x, y, x + w, y, r);
        ctx.closePath();
      },

      // Chamber Backdrop Box (Fills large zones of the 1100x640 canvas)
      drawSiliconChamber(ctx, x, y, w, h, title, badge, borderColor, tintFill) {
        ctx.save();
        this.drawRoundedRect(ctx, x, y, w, h, 18);
        ctx.fillStyle = tintFill || "rgba(17, 24, 39, 0.78)";
        ctx.fill();
        ctx.lineWidth = 2.5;
        ctx.strokeStyle = borderColor || "rgba(255,255,255,0.16)";
        ctx.stroke();

        // Header strip inside chamber
        this.drawRoundedRect(ctx, x + 14, y + 14, w - 28, 42, 10);
        ctx.fillStyle = "rgba(9, 13, 22, 0.92)";
        ctx.fill();

        const innerW = w - 48;
        ctx.font = w < 380 ? "900 14.5px 'JetBrains Mono', monospace" : "900 16.5px 'JetBrains Mono', monospace";
        let badgeW = 0;
        if (badge) {
          badgeW = ctx.measureText(badge).width;
          ctx.fillStyle = borderColor || "#38BDF8";
          ctx.textAlign = "right";
          ctx.fillText(badge, x + w - 24, y + 40);
        }

        ctx.fillStyle = "#F8FAFC";
        ctx.textAlign = "left";
        const maxTitleW = Math.max(80, innerW - (badgeW > 0 ? badgeW + 16 : 0));
        ctx.fillText(title, x + 24, y + 40, maxTitleW);
        ctx.restore();
      },

      // Lifelike Delidded AMD Ryzen 9 9950X (Zen 5) Package with Rainbow Wafer Chiplets
      drawZen5Package(ctx, cx, cy, scale, label, highlightColor, pulsePhase) {
        ctx.save();
        ctx.translate(cx, cy);
        ctx.scale(scale, scale);

        ctx.shadowColor = "rgba(0, 0, 0, 0.85)";
        ctx.shadowBlur = 34;
        ctx.shadowOffsetY = 14;

      // Lifelike 3D DDR5 RAM DIMM Module with 288 Gold Contact Fingers

      // Lifelike 3D Titanium-Rim Optical Glass Lens
      drawOpticalLens(ctx, cx, cy, radius, topLabel, bottomLabel, color) {
        ctx.save();
        ctx.translate(cx, cy);

        const aura = ctx.createRadialGradient(0, 0, radius * 0.4, 0, 0, radius * 1.55);
        aura.addColorStop(0, color + "55");
        aura.addColorStop(1, "transparent");
        ctx.fillStyle = aura;
        ctx.beginPath(); ctx.arc(0, 0, radius * 1.55, 0, Math.PI * 2); ctx.fill();

        const ringGrad = ctx.createLinearGradient(-radius, -radius, radius, radius);
        ringGrad.addColorStop(0, "#F8FAFC");
        ringGrad.addColorStop(0.3, "#64748B");
        ringGrad.addColorStop(0.6, "#CBD5E1");
        ringGrad.addColorStop(1, "#1E293B");
        ctx.beginPath();
        ctx.arc(0, 0, radius, 0, Math.PI * 2);
        ctx.fillStyle = ringGrad;
        ctx.fill();

        const glassGrad = ctx.createRadialGradient(-radius * 0.3, -radius * 0.3, 5, 0, 0, radius * 0.88);
        glassGrad.addColorStop(0, "rgba(255, 255, 255, 0.38)");
        glassGrad.addColorStop(0.35, "rgba(56, 189, 248, 0.20)");
        glassGrad.addColorStop(0.85, "rgba(9, 13, 22, 0.90)");
        glassGrad.addColorStop(1, "rgba(56, 189, 248, 0.48)");
        ctx.beginPath();
        ctx.arc(0, 0, radius * 0.88, 0, Math.PI * 2);
        ctx.fillStyle = glassGrad;
        ctx.fill();
        ctx.lineWidth = 3;
        ctx.strokeStyle = color;
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(-radius * 0.18, -radius * 0.18, radius * 0.62, Math.PI * 1.1, Math.PI * 1.65);
        ctx.strokeStyle = "rgba(255, 255, 255, 0.58)";
        ctx.lineWidth = 6;
        ctx.lineCap = "round";
        ctx.stroke();

        ctx.fillStyle = "#F8FAFC";
        ctx.font = "900 19.5px 'JetBrains Mono', monospace";
        ctx.textAlign = "center";
        ctx.fillText(topLabel, 0, -4);
        ctx.fillStyle = color;
        ctx.font = "800 17px 'JetBrains Mono', monospace";
        ctx.fillText(bottomLabel, 0, 22);

        ctx.restore();
      },

      // 3D Hardware Register Pill Helper
      drawRegisterPill(ctx, x, y, w, h, regName, regVal, borderColor) {

        ctx.fillStyle = borderColor || "#38BDF8";

        const valX = x + 8 + boxW + 14;

        ctx.font = "800 17.5px 'JetBrains Mono', monospace";
        ctx.textAlign = "left";
        ctx.fillText(regVal, valX, y + h / 2 + 6, maxValW);
        ctx.restore();
      },

      // Master Scene Dispatcher for Slides 01..29 (1100 x 640 Full-Bleed Canvas)
      renderScene(canvas, slideNum, activeStep, pulsePhase) {
        if (!canvas) return;
        const ctx = canvas.getContext("2d");
        const W = canvas.width;
        const H = canvas.height;
        ctx.clearRect(0, 0, W, H);

        // Subtle silicon wafer grid across full 1100x640 stage
        ctx.strokeStyle = "rgba(56, 189, 248, 0.055)";
        ctx.lineWidth = 1;
        for (let x = 0; x < W; x += 48) {
          ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
        }
        for (let y = 0; y < H; y += 48) {
          ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
        }

        const drawLaser = (x1, y1, x2, y2, color, width) => {
          ctx.save();
          ctx.strokeStyle = color;
          ctx.lineWidth = width || 5;
          ctx.shadowColor = color;
          ctx.shadowBlur = 16;
          ctx.setLineDash([16, 9]);
          ctx.lineDashOffset = -pulsePhase * 46;
          ctx.beginPath();
          ctx.moveTo(x1, y1);
          ctx.lineTo(x2, y2);
          ctx.stroke();
          ctx.restore();
        };

        switch (slideNum) {
          case 1:
          case 23: {
            // Full-Stage Virtual Pointer Illusion -> MMU Optical Lens -> Physical DDR5 Frame
            this.drawSiliconChamber(ctx, 24, 24, 340, H - 48, "RING 3 VIRTUAL SPACE", "48-BIT VA", "#38BDF8", "rgba(15, 29, 52, 0.72)");
            this.drawSiliconChamber(ctx, 736, 24, 340, H - 48, "DDR5 PHYSICAL DRAM", "52-BIT PA", "#10B981", "rgba(11, 34, 27, 0.72)");

            this.drawZen5Package(ctx, 194, H / 2 - 40, 0.96, "CORE 0 LOAD", "#38BDF8", pulsePhase);
            this.drawRegisterPill(ctx, 44, H - 115, 300, 62, "VA PTR", "0x7fff5fbff8c0", "#38BDF8");

            drawLaser(338, H / 2 - 40, 442, H / 2 - 40, "#38BDF8", 6);
            this.drawOpticalLens(ctx, 550, H / 2 - 40, 98, "HARDWARE MMU", "CR3 + TLB", "#38BDF8");
            this.drawRegisterPill(ctx, 415, H - 115, 270, 62, "CR3", "0x00104000", "#F59E0B");
            drawLaser(652, H / 2 - 40, 756, H / 2 - 40, "#10B981", 6);

            this.drawDDR5Module(ctx, 906, H / 2 - 95, 0.80, "PROCESS A FRAME", "PA: 0x1A480F8C0", "#10B981", true);
            this.drawDDR5Module(ctx, 906, H / 2 + 80, 0.80, "PROCESS B FRAME", "PA: 0x2F910C8C0", "#38BDF8", true);
            break;
          }
          case 2:
          case 4: {
            // 3 Full-Height Hardware Pillars: 1. vDSO Board, 2. #PF Strobe Siren, 3. 2MiB HugePages
            this.drawSiliconChamber(ctx, 20, 24, 340, H - 48, "1. RING 3 vDSO", "18.0 ns", "#10B981", "rgba(11, 34, 27, 0.7)");
            this.drawSplitFlapBoard(ctx, 190, H / 2 + 25, 308, 440, "✈️ [vvar] SEQLOCK", [
              { left: "steady_clock", right: "18.0 ns", badgeColor: "#34D399" },
              { left: "SYS_clock", right: "68.9 ns", badgeColor: "#FB7185" },
              { left: "SYS_gettid", right: "41.7 ns", badgeColor: "#FB7185" },
              { left: "TLS gettid", right: "0.21 ns", badgeColor: "#38BDF8" }
            ]);

            this.drawSiliconChamber(ctx, 380, 24, 340, H - 48, "2. DEMAND PAGING", "512 #PFs", "#F43F5E", "rgba(42, 14, 27, 0.75)");
            this.drawFireAlarmStrobe(ctx, 550, H / 2 - 45, 1.35, "512 × #PF TRAPS", "425 ns / 4 KiB", pulsePhase);
            this.drawRegisterPill(ctx, 400, H - 115, 300, 64, "MAP_POP", "217.6 µs → 197 ns", "#10B981");

            this.drawSiliconChamber(ctx, 740, 24, 340, H - 48, "3. 2 MiB HUGEPAGES", "2.14x", "#38BDF8", "rgba(15, 29, 52, 0.75)");
            this.drawZen5Package(ctx, 910, H / 2 - 80, 0.85, "L2 TLB: 256", "#38BDF8", pulsePhase);
            this.drawDDR5Module(ctx, 910, H / 2 + 135, 0.78, "2 MiB HUGEPAGE", "-99.99% TLB Misses", "#10B981", true);
            break;
          }
          case 3:
          case 7: {
            // Ring 3 Userspace Chamber vs. Silicon Border Laser Gate vs. Ring 0 Kernel Vault
            this.drawSiliconChamber(ctx, 24, 24, 430, H - 48, "RING 3 USERSPACE", "CS.CPL == 3", "#38BDF8", "rgba(15, 29, 52, 0.72)");
            this.drawZen5Package(ctx, 238, H / 2 - 45, 1.0, "UNTRUSTED APP", "#38BDF8", pulsePhase);
            this.drawRegisterPill(ctx, 52, H - 118, 374, 64, "CPL = 3", "PTE U/S == 1 Only", "#38BDF8");

            // Red Laser Security Border Gate in Center
            ctx.fillStyle = "rgba(244, 63, 94, 0.20)";
            ctx.fillRect(495, 24, 110, H - 48);
            for (let ly = 48; ly < H - 40; ly += 34) {
              drawLaser(495, ly, 605, ly, "#F43F5E", 3.5);
            }
            this.drawOpticalLens(ctx, 550, H / 2 - 20, 74, "SILICON", "BORDER", "#F43F5E");

            this.drawSiliconChamber(ctx, 646, 24, 430, H - 48, "RING 0 KERNEL VAULT", "CS.CPL == 0", "#F43F5E", "rgba(42, 14, 27, 0.75)");
            this.drawDDR5Module(ctx, 860, H / 2 - 90, 0.88, "KERNEL PAGE TABLES", "CR3 • IA32_LSTAR • IDT", "#F43F5E", true);
            this.drawRegisterPill(ctx, 674, H / 2 + 30, 374, 62, "CR3 REG", "Page Table Root PA", "#F59E0B");
            this.drawRegisterPill(ctx, 674, H - 118, 374, 64, "CPL = 0", "Full Silicon Control", "#F43F5E");
            break;
          }
          case 5:
          case 6: {
            // High-Frequency Telemetry Gateway: vDSO Ring 3 Fast Lane vs Ring 0 Syscall Slow Lane
            this.drawSiliconChamber(ctx, 24, 24, 340, H - 48, "PACKET GATEWAY", "ZEN 5 CORE", "#38BDF8", "rgba(15, 29, 52, 0.72)");
            this.drawZen5Package(ctx, 194, H / 2 + 15, 1.02, "TELEMETRY", "#38BDF8", pulsePhase);

      const tag = String(s.num).padStart(2, "0");
      stageEl.innerHTML = (function buildSlideSectionHTML(s) {
      const tag = String(s.num).padStart(2, "0");
      return `
        <section id="slide-${s.num}" class="slide-section active-slide">
          <header class="slide-header">
            <div class="header-left">
              <span class="slide-marker">${tag} / 29</span>
              <h1 class="slide-title">${s.title}</h1>
            </div>
            <span class="header-act">${s.act}</span>
          </header>

          <div class="main-stage-grid">
            <!-- LEFT COLUMN (FIXED 660px ANCHOR): CODE CANVAS + 2 HARDWARE REGISTER CARDS -->
            <div class="left-code-column">
              <div id="s${s.num}-step-1" class="surface-panel code-anchor-panel reveal-step step-active glow-base">
                <div class="zone-header">
                  <span class="zone-label">C++20 / X86-64 SILICON SPEC</span>
                  <span class="${s.codeBadgeClass}" style="font-size:16.5px;">${s.codeBadge}</span>
                </div>

                <div class="code-canvas">
                  <div class="code-canvas-header">
                    <div class="code-dots">
                      <span class="code-dot red"></span>
                      <span class="code-dot amber"></span>
                      <span class="code-dot green"></span>
                    </div>
                    <span class="code-file-label">${s.codeFile}</span>
                  </div>
                  <div class="code-canvas-body">
                    ${s.codeLines.map(line => `<div class="code-line">${line}</div>`).join("")}
                  </div>
                </div>
              </div>

              <!-- 2 Hardware Register / State Key Cards (Zero Prose) -->
              <div class="hw-key-grid">
                <div class="hw-key-card" style="border-color:${s.key1Color}66;">
                  <span class="hw-key-label">${s.key1Label}</span>
                  <span class="hw-key-val" style="color:${s.key1Color};">${s.key1Val}</span>
                </div>
                <div class="hw-key-card" style="border-color:${s.key2Color}66;">
                  <span class="hw-key-label">${s.key2Label}</span>
                  <span class="hw-key-val" style="color:${s.key2Color};">${s.key2Val}</span>
                </div>
              </div>
            </div>

            <!-- RIGHT COLUMN (1152px FULL-BLEED): 3D HARDWARE STAGE + SINGLE TELEMETRY BAR -->
            <div class="right-visual-column">
              <div id="s${s.num}-step-2" class="surface-panel visual-stage-panel reveal-step ${s.stageGlow}">
                <div class="zone-header">
                  <span class="zone-label" style="color:#7DD3FC;">${s.stageLabel}</span>
                  <span class="${s.stageBadgeClass}" style="font-size:16.5px;">${s.stageBadge}</span>
                </div>

                <div class="realistic-canvas-wrap">
                  <canvas id="hw-canvas-${s.num}" width="1100" height="640"></canvas>
                </div>
              </div>

              <!-- STEP 3: SINGLE TRUE-TO-SCALE TELEMETRY VERDICT BAR -->
              <div id="s${s.num}-step-3" class="surface-panel telemetry-bar-panel reveal-step glow-fast">
                <div class="metric-compare-box" style="border-color:rgba(244,63,94,0.45);">
                  <div class="metric-compare-top">
                    <span class="metric-tag" style="color:#FDA4AF;">✗ ${s.leftTag}</span>
                    <span class="metric-hero-num" style="color:#F8FAFC;">${s.leftMetric}</span>
                  </div>
                  <div class="bar-track">
                    <div class="bar-fill-danger" style="width:${s.leftBarPct}%;"></div>
                  </div>
                </div>

                <div class="metric-compare-box" style="border-color:rgba(16,185,129,0.50);">
                  <div class="metric-compare-top">
                    <span class="metric-tag" style="color:#6EE7B7;">✓ ${s.rightTag}</span>
                    <span class="metric-hero-num" style="color:#34D399;">${s.rightMetric}</span>
                  </div>
                  <div class="bar-track">
                    <div class="bar-fill-fast" style="width:${s.rightBarPct}%;"></div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </section>
      `;
    })(s);
      document.getElementById("dock-slide-buttons").innerHTML = SLIDES.map((sl, idx) => {
        const t = String(sl.num).padStart(2, "0");
        return '<button class="dock-btn ' + (idx === activeIdx ? 'active' : '') + '" onclick="selectIdx(' + idx + ')">' + t + ' / 29</button>';
      }).join("");
      elapsedSec = 0;
      activeStep = 1;
      applySteps();
      fitStage();
    }

    function selectIdx(idx) {
      activeIdx = idx;
      render();
    }

    function setStep(st) {
      isAutoPlaying = false;
      document.getElementById("autoplay-label").textContent = "▶ Manual";
      activeStep = Math.max(1, Math.min(3, st));
      applySteps();
    }

    function restartSlide() {
      elapsedSec = 0;
      activeStep = 1;
      applySteps();
    }

    function toggleAutoPlay() {
      isAutoPlaying = !isAutoPlaying;
      document.getElementById("autoplay-label").textContent = isAutoPlaying ? "⏸ Auto-Sync" : "▶ Manual";
    }

    function applySteps() {
      const sNum = SLIDES[activeIdx].num;
      for (let i = 1; i <= 3; i++) {
        document.getElementById("step-dot-" + i).classList.toggle("active", i <= activeStep);
        const el = document.getElementById("s" + sNum + "-step-" + i);
        if (el) el.classList.toggle("step-active", i <= activeStep);
      }
    }

    function loop(ts) {
      if (!lastTs) lastTs = ts;
      const dt = (ts - lastTs) / 1000;
      lastTs = ts;
      pulsePhase += dt;
      const s = SLIDES[activeIdx];
      if (isAutoPlaying) {
        elapsedSec += dt;
        if (elapsedSec > 16.0) elapsedSec = 0;
        let target = 1;
        for (let i = s.timings.length - 1; i >= 0; i--) {
          if (elapsedSec >= s.timings[i]) { target = i + 1; break; }
        }
        if (target !== activeStep) { activeStep = target; applySteps(); }
      }
      const c = document.getElementById("hw-canvas-" + s.num);
      if (c) HardwareArtEngine.renderScene(c, s.num, activeStep, pulsePhase);
      requestAnimationFrame(loop);
    }

    window.addEventListener("keydown", (e) => {
      if (e.code === "Space" || e.key === "ArrowRight") {
        e.preventDefault();
        if (activeStep < 3) setStep(activeStep + 1);
        else if (!true && activeIdx < SLIDES.length - 1) selectIdx(activeIdx + 1);
      } else if (e.key === "ArrowLeft") {
        e.preventDefault();
        if (activeStep > 1) setStep(activeStep - 1);
        else if (!true && activeIdx > 0) selectIdx(activeIdx - 1);
      } else if (e.key.toLowerCase() === "r") restartSlide();
      else if (e.key.toLowerCase() === "h") document.body.classList.toggle("clean-capture");
    });

    render();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
